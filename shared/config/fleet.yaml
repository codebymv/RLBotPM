# Fleet Orchestration - Run both bots in parallel
# ===============================================
# Usage:
#   python main.py fleet start --dry-run   (paper mode, no real money)
#   python main.py fleet start             (live mode, requires promotion gates)
#
# Architecture policy (research/architecture-audit-03.md stop-doing list):
# - Do not run Kalshi profit-seeking paper/live while strategies are parked.
# - Do not enable rl_crypto until a promoted deployable artifact exists.
# - H-PERP-003 paper logger is the active paper-observation path (no orders).

fleet:
  # Global circuit breaker (orchestrator-level)
  max_combined_daily_loss_usd: 50.0   # Halt both bots if combined daily loss exceeds this
  max_combined_drawdown_pct: 0.15     # Halt if combined drawdown > 15%

  # Preflight: require both promotion gates to pass before starting live
  require_kalshi_gate: true
  require_rl_gate: true

# -----------------------------------------------------------------------------
# Bot 1: Kalshi Prediction Markets
#   --dry-run  → kalshi paper-trade --live (paper portfolio, no real orders)
#   live       → kalshi live-trade (real orders)
#   Disabled: strategy layer parked (architecture-audit-02 / audit-03 Track C).
# -----------------------------------------------------------------------------
kalshi:
  enabled: false
  interval: 300
  min_edge: 0.015
  max_edge: 0.60
  min_price: 1
  max_price: 50
  bankroll: 100.0                # paper-trade only
  max_positions: 10
  max_new_trades_per_scan: 4
  max_session_loss: 5.0          # paper session loss stop
  series: null                   # null = all crypto series
  # live-trade only (real money)
  max_cost: 1.0
  max_total: 10.0
  max_loss_streak: 3
  max_daily_loss: 5.0

# -----------------------------------------------------------------------------
# Bot 2: RL Crypto Spot (Coinbase)
#   --dry-run  → rl-paper-trade (live data, paper portfolio, no real orders)
#   live       → live_trader --mode live (real orders via Coinbase)
# -----------------------------------------------------------------------------
rl_crypto:
  # Disabled: run 174 / artifact best_model_run_176.zip failed walk-forward
  # promotion (research/RL_RUN_174_RESULTS.md). Do not point fleet at a
  # non-promoted zip — see research/architecture-audit-01.md / audit-03 §B.
  enabled: false
  model: null                    # set only after a promoted best_model_run_*.zip
  symbols: null                  # null = all from DATA_SYMBOLS env var
  interval: "1h"
  capital: 1000.0
  duration: 0                    # 0 = indefinite
  # live-trade only
  symbol: "BTC-USD"
  tick_interval: 60

# -----------------------------------------------------------------------------
# Research sleeve: H-PERP-003 hedged carry paper logger (OKX public REST)
#   Always paper-only — never sends orders. Preferred dry-run path while
#   Kalshi / RL sleeves remain disabled.
# -----------------------------------------------------------------------------
h_perp_003:
  enabled: true
  interval: 300                  # seconds between polls (funding is 8h)
