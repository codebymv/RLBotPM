name: H-PERP-003 daily capture

# Track A1 of architecture-audit-03: append-only OKX hedged-panel pull.
# Runs daily at 00:30 UTC and on manual dispatch. Commits any new rows directly
# to the working branch so the dataset accumulates without operator intervention.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no CSV write, no commit)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: h-perp-003-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3

      - name: Run daily capture
        id: capture
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python research/datasets/H-PERP-003/daily_capture.py --dry-run
          else
            python research/datasets/H-PERP-003/daily_capture.py
          fi

      - name: Commit dataset deltas
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -e
          git config user.name  "h-perp-003-capture[bot]"
          git config user.email "h-perp-003-capture@users.noreply.github.com"
          git add research/datasets/H-PERP-003/btc_hedged_panel_okx.csv \
                  research/datasets/H-PERP-003/pull_log.jsonl
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            STAMP=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "data(H-PERP-003): daily capture ${STAMP}"
            git push
          fi
